# Reference: https://build-cpp.github.io/cmkr/cmake-toml
# NOTE: cmake.toml is the single source of truth. CMakeLists.txt is generated
# by cmkr — never hand-edit it. Adding a source file requires re-running the
# configure step so the globs below refresh.
[project]
name = "WorldWalker"
version = "0.1.0"
description = "Speed-focused C++ pathfinding library for RuneScape 3 (NXT engine)"
languages = ["CXX"]
cmake-before = """
if(NOT DEFINED CMAKE_CXX_STANDARD)
    set(CMAKE_CXX_STANDARD 23)
endif()
set(CMAKE_CXX_STANDARD_REQUIRED ON)
set(CMAKE_CXX_EXTENSIONS OFF)
"""
cmake-after = """
if(MSVC)
    add_compile_definitions(NOMINMAX WIN32_LEAN_AND_MEAN UNICODE _UNICODE)
    add_compile_options(/W4 /WX /permissive- /Zc:preprocessor /utf-8)
endif()
"""

# ---- Runtime query library (planner + executor + C ABI) --------------------
# Consumers (the Java host via Panama, others) load this. The offline builder
# and the dev harness link against it.
#
# Source globs are added as each phase lands its directory (cmkr requires a
# globbed directory to exist at configure time):
#   src/format/  — artifact read/write     (Phase 2/3)
#   src/runtime/ — planner + search         (Phase 3)
#   src/exec/    — executor + callbacks      (Phase 4)
[target.worldwalker]
type = "shared"
sources = [
    "src/c_api/*.cpp",
]
headers = [
    "src/c_api/*.h",
]
include-directories = ["src"]
compile-features = ["cxx_std_23"]
compile-definitions = ["WORLDWALKER_BUILDING"]
properties.WINDOWS_EXPORT_ALL_SYMBOLS = true

# ---- Offline artifact builder ----------------------------------------------
# Decodes the cache, ingests datasets, builds the abstract graph + ALT tables,
# and serializes the baked artifact. src/data/ (dataset ingest) is added in
# Phase 2.
[target.wwbuild]
type = "executable"
sources = [
    "src/build/*.cpp",
]
include-directories = ["src"]
link-libraries = ["worldwalker"]
compile-features = ["cxx_std_23"]

# ---- Dev harness (queries + benchmarks) ------------------------------------
[target.wwcli]
type = "executable"
sources = ["src/cli/*.cpp"]
include-directories = ["src"]
link-libraries = ["worldwalker"]
compile-features = ["cxx_std_23"]
