# Reference: https://build-cpp.github.io/cmkr/cmake-toml
# NOTE: cmake.toml is the single source of truth. CMakeLists.txt is generated
# by cmkr — never hand-edit it. Adding a source file requires re-running the
# configure step so the globs below refresh.
[project]
name = "WorldWalker"
version = "0.1.0"
description = "Speed-focused C++ pathfinding library for RuneScape 3 (NXT engine)"
languages = ["CXX"]
cmake-before = """
# Match NXTCacheLibrary's triplet so the shared vcpkg binary cache (zlib) is
# reused and the dynamic CRT is kept (required for loading from the JVM later).
set(VCPKG_TARGET_TRIPLET x64-windows-static-md)

if(NOT DEFINED CMAKE_CXX_STANDARD)
    set(CMAKE_CXX_STANDARD 23)
endif()
set(CMAKE_CXX_STANDARD_REQUIRED ON)
set(CMAKE_CXX_EXTENSIONS OFF)
"""
cmake-after = """
if(MSVC)
    add_compile_definitions(NOMINMAX WIN32_LEAN_AND_MEAN UNICODE _UNICODE)
    add_compile_options(/W4 /WX /permissive- /Zc:preprocessor /utf-8)
endif()

# wwbuild decodes the RS cache through the NXTCache C ABI (offline only), from
# the prebuilt DLL + import lib produced by NXTCacheLibrary's `cmake -B build`.
# That sibling is not public, so it may simply be absent.
#
# Absent is a supported configuration. `worldwalker` and `wwcli` link only zlib
# and nlohmann_json, so everything except baking still builds; wwbuild is
# dropped from the build instead of failing it. Auto-detected here, overridable
# with -DWORLDWALKER_BUILD_WWBUILD=ON/OFF, and -DNXTCACHE_BUILD_DIR=<dir> points
# the search elsewhere (that dir must contain <CONFIG>/NXTCache.{lib,dll}).
#
# The detection is deliberately scoped to "is wwbuild going to be built", NOT
# run unconditionally: a contributor editing only the runtime-loaded teleport
# datasets must never be stopped at configure time by a dependency they do not
# use. See docs/artifact-delivery.md section 7.
if(NOT DEFINED NXTCACHE_BUILD_DIR)
    set(NXTCACHE_BUILD_DIR "${CMAKE_CURRENT_SOURCE_DIR}/../NXTCacheLibrary/build")
endif()
set(NXTCACHE_INCLUDE_DIR "${CMAKE_CURRENT_SOURCE_DIR}/../NXTCacheLibrary/src")

if(EXISTS "${NXTCACHE_INCLUDE_DIR}/c_api/nxtcache_c.h"
   AND (EXISTS "${NXTCACHE_BUILD_DIR}/Release/NXTCache.lib"
        OR EXISTS "${NXTCACHE_BUILD_DIR}/Debug/NXTCache.lib"))
    set(WORLDWALKER_NXTCACHE_FOUND ON)
else()
    set(WORLDWALKER_NXTCACHE_FOUND OFF)
endif()

option(WORLDWALKER_BUILD_WWBUILD
       "Build wwbuild, the offline artifact baker (requires NXTCacheLibrary)"
       ${WORLDWALKER_NXTCACHE_FOUND})

# An explicit -DWORLDWALKER_BUILD_WWBUILD=ON with no sibling is a mistake worth
# catching now, with a message that says what to do, rather than as an opaque
# link error several minutes into the build.
if(WORLDWALKER_BUILD_WWBUILD AND NOT WORLDWALKER_NXTCACHE_FOUND)
    message(FATAL_ERROR
        "WORLDWALKER_BUILD_WWBUILD=ON but NXTCacheLibrary was not found.\n"
        "  Looked for: ${NXTCACHE_INCLUDE_DIR}/c_api/nxtcache_c.h\n"
        "        and : ${NXTCACHE_BUILD_DIR}/<Release|Debug>/NXTCache.lib\n"
        "Build the sibling repo first, pass -DNXTCACHE_BUILD_DIR=<dir>, or "
        "configure with -DWORLDWALKER_BUILD_WWBUILD=OFF to skip the baker. "
        "The runtime library and wwcli do not need it.")
endif()

if(WORLDWALKER_BUILD_WWBUILD)
    if(NOT TARGET NXTCache::NXTCache)
        add_library(NXTCache::NXTCache SHARED IMPORTED)
        set_target_properties(NXTCache::NXTCache PROPERTIES
            INTERFACE_INCLUDE_DIRECTORIES "${NXTCACHE_INCLUDE_DIR}"
            IMPORTED_CONFIGURATIONS "DEBUG;RELEASE"
            IMPORTED_IMPLIB_DEBUG     "${NXTCACHE_BUILD_DIR}/Debug/NXTCache.lib"
            IMPORTED_LOCATION_DEBUG   "${NXTCACHE_BUILD_DIR}/Debug/NXTCache.dll"
            IMPORTED_IMPLIB_RELEASE   "${NXTCACHE_BUILD_DIR}/Release/NXTCache.lib"
            IMPORTED_LOCATION_RELEASE "${NXTCACHE_BUILD_DIR}/Release/NXTCache.dll"
            MAP_IMPORTED_CONFIG_RELWITHDEBINFO "Release"
            MAP_IMPORTED_CONFIG_MINSIZEREL "Release")
    endif()
    message(STATUS "WorldWalker: baking enabled (NXTCacheLibrary at ${NXTCACHE_BUILD_DIR})")
else()
    message(STATUS
        "WorldWalker: NXTCacheLibrary not found -- building worldwalker + wwcli only. "
        "Baking an artifact needs it; everything else does not. "
        "Grab a prebuilt .wwa from the releases page.")
endif()
"""

# Named conditions usable as `condition = "..."` on a target. The variable
# itself is defined in cmake-after above.
[conditions]
build-wwbuild = "WORLDWALKER_BUILD_WWBUILD"

[vcpkg]
version = "2025.06.13"
packages = ["zlib", "nlohmann-json"]

[find-package]
ZLIB = { }
nlohmann_json = { }

# ---- Runtime query library (planner + executor + C ABI) --------------------
# Consumers (the Java host via Panama, others) load this. The offline builder
# and the dev harness link against it.
#
# Source globs are added as each phase lands its directory (cmkr requires a
# globbed directory to exist at configure time):
#   src/format/  — artifact read/write     (Phase 2/3)
#   src/runtime/ — planner + search         (Phase 3)
#   src/exec/    — executor + callbacks      (Phase 4)
[target.worldwalker]
type = "shared"
sources = [
    "src/format/*.cpp",
    "src/runtime/*.cpp",
    "src/exec/*.cpp",
    "src/c_api/*.cpp",
    # Runtime-loaded global teleports (spell + lodestone) are parsed from
    # editable JSON at open time, not baked. DatasetLoader is collision-free
    # (JSON via nlohmann only), so it compiles into the runtime DLL. wwbuild
    # links worldwalker and reuses this exported copy rather than recompiling.
    "src/data/DatasetLoader.cpp",
]
headers = [
    "src/format/*.h",
    "src/runtime/*.h",
    "src/exec/*.h",
    "src/c_api/*.h",
    "src/data/DatasetLoader.h",
    "src/data/Transitions.h",
    "src/data/TransitionCost.h",
]
include-directories = ["src"]
link-libraries = ["ZLIB::ZLIB", "nlohmann_json::nlohmann_json"]
compile-features = ["cxx_std_23"]
compile-definitions = ["WORLDWALKER_BUILDING"]
properties.WINDOWS_EXPORT_ALL_SYMBOLS = true

# ---- Offline artifact builder ----------------------------------------------
# Decodes the cache, ingests datasets, builds the abstract graph + ALT tables,
# and serializes the baked artifact. src/data/ holds the dataset ingest (JSON via
# nlohmann_json) — build-time only, so it links here rather than into worldwalker.
[target.wwbuild]
type = "executable"
# Dropped from the build when NXTCacheLibrary is absent (see cmake-after).
condition = "build-wwbuild"
sources = [
    "src/build/*.cpp",
    # src/data/*.cpp except DatasetLoader.cpp — that one compiles into
    # worldwalker (runtime teleport loading) and is reused here via the export,
    # so listing it again would double-compile it. Add new src/data files here.
    "src/data/CrossingDeriver.cpp",
    "src/data/FreshnessDeriver.cpp",
    "src/data/TeleportZones.cpp",
    "src/data/TransitionBuilder.cpp",
]
include-directories = ["src"]
link-libraries = ["worldwalker", "NXTCache::NXTCache", "nlohmann_json::nlohmann_json"]
compile-features = ["cxx_std_23"]

# ---- Dev harness (queries + benchmarks) ------------------------------------
# nlohmann_json is linked for the `wwcli path` subcommand's JSON export
# (PathExport.cpp) — input to the standalone Leaflet viewer in tools/viewer/.
[target.wwcli]
type = "executable"
sources = ["src/cli/*.cpp"]
include-directories = ["src"]
link-libraries = ["worldwalker", "nlohmann_json::nlohmann_json"]
compile-features = ["cxx_std_23"]
